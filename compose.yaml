services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: mashy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mashy_dev_only}
      POSTGRES_DB: mashy
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - mashy_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mashy"]
      interval: 5s
      retries: 10
volumes:
  mashy_db:
